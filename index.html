<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Phonics CVC Words · Ben Widdowson</title>
<meta name="description" content="A drag-and-drop spelling game for practising three-letter CVC words. Free classroom tool by Ben Widdowson.">
<meta name="theme-color" content="#7a3fa6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1612" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ben Widdowson">
<meta property="og:title" content="Phonics CVC Words">
<meta property="og:description" content="A drag-and-drop spelling game for practising three-letter CVC words. Free classroom tool by Ben Widdowson.">
<meta property="og:url" content="https://phonics-drag-spell.pages.dev/">
<meta property="og:image" content="https://benwiddowson.com/brand/favicon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" sizes="32x32" href="https://benwiddowson.com/brand/favicon-32.png">
<link rel="apple-touch-icon" href="https://benwiddowson.com/brand/apple-touch-icon.png">
<link rel="stylesheet" href="https://benwiddowson.com/site/v1/tokens.css">
<link rel="stylesheet" href="https://benwiddowson.com/site/v1/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SPLASH -->
  <div id="screen-splash" class="screen active">
    <div class="splash-content">
      <h1 class="app-title">Phonics<br><span>CVC Words</span></h1>
      <div class="splash-buttons">
        <button class="btn btn-primary" id="btn-quick-start">Quick Start</button>
        <button class="btn btn-ghost" id="btn-options">Choose Options</button>
      </div>
    </div>
    <footer class="app-footer splash-foot no-print"><div class="container app-footer-inner">
    <span>by <a href="https://benwiddowson.com/">Ben Widdowson</a> · <a href="https://benwiddowson.com/apps.html">school apps</a></span>
    <ul class="social-links">
      <li><a href="https://github.com/ben25w">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/bwiddowson/">LinkedIn</a></li>
    </ul>
  </div></footer>
  </div>

  <!-- SETTINGS -->
  <div id="screen-settings" class="screen">
    <div class="settings-content">
      <h2>Options</h2>

      <div class="setting-row">
        <span class="setting-label">Stage</span>
        <select id="stage-select"></select>
      </div>

      <div class="setting-row">
        <span class="setting-label">Input</span>
        <div class="btn-group" id="input-mode-group">
          <button class="toggle active" data-value="drag">Drag</button>
          <button class="toggle" data-value="tap">Tap</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Tries</span>
        <div class="btn-group" id="tries-group">
          <button class="toggle" data-value="1">1</button>
          <button class="toggle active" data-value="3">3</button>
          <button class="toggle" data-value="5">5</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Keyboard</span>
        <div class="btn-group" id="keyboard-layout-group">
          <button class="toggle active" data-value="intro">Taught Order</button>
          <button class="toggle" data-value="qwerty">QWERTY</button>
        </div>
      </div>

      <button class="btn btn-primary" id="btn-start">Start!</button>
      <button class="btn btn-text" id="btn-back-from-settings">← Back</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <button class="btn-icon" id="btn-exit-game">✕</button>
      <div class="game-progress" id="game-progress">1 / 10</div>
      <div class="game-tries" id="game-tries"></div>
    </div>

    <div class="picture-area">
      <div class="picture-frame">
        <img id="word-image" src="" alt="Guess this word">
        <div class="img-placeholder">🖼️</div>
      </div>
    </div>

    <div class="boxes-area" id="letter-boxes"></div>

    <div class="feedback-area" id="feedback"></div>

    <div class="keyboard-area" id="keyboard"></div>
  </div>

  <!-- END -->
  <div id="screen-end" class="screen">
    <div class="end-content">
      <div class="end-star">⭐</div>
      <h2>Well Done!</h2>
      <p id="end-score"></p>
      <button class="btn btn-primary" id="btn-play-again">Play Again</button>
      <button class="btn btn-ghost" id="btn-new-game">Change Options</button>
    </div>
  </div>

  <!-- Ghost tile for drag -->
  <div id="ghost-tile" class="ghost-tile"></div>

  <script src="app.js"></script>
</body>
</html>
